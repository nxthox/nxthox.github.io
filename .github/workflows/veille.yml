name: Veille techno (mise a jour auto)
on: {schedule: [{cron: "0 * * * *"}], workflow_dispatch: {}}
permissions: {contents: write}
jobs: {veille: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-node@v4, with: {node-version: 20}}, {run: node scripts/veille.mjs}, {name: Enregistrer veille.json, run: "git config user.name veille-bot && git config user.email veille-bot@users.noreply.github.com && git add veille.json && (git diff --cached --quiet || (git commit -m 'Veille auto' && git push))"}]}}
